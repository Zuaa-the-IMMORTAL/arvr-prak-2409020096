<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Praktikum 1 - Scene Pertama</title>
 <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
 <a-scene>
 <a-dodecahedron position="1.148 1.266 -4.107" rotation="0 45 0" color="#0A3323"></a-dodecahedron>
 <a-octahedron position="0 1.25 -5" radius="1.25" color="#D3968C" animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: easeInOut"></a-octahedron>
 <a-cylinder position="-1.339 1.129 -2.520" radius="0.5" height="1.5" color="#839958"></a-cylinder>
 <a-plane position="0 0 -4" rotation="-90 0 0" width="6" height="6"
 color="#7BC8A4"></a-plane>
 <a-sky color="#ECECEC"></a-sky>
 <a-text value="Zahrani nazwa - 2409020096 \nAslinya pengen jadi animator" position="0 2.5 -3" align="center" color="#222222"
width="6"  animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000; easing: linear"></a-text>
 </a-scene>
</body>
</html>
